<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Sherpas video</title>
<link rel="stylesheet" href="/tokens.css">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--surface-base); color: var(--gray-900); font-family: var(--font-body);
         display: flex; flex-direction: column; }
  header { padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
  header img { height: 24px; }
  main { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; padding: 0 16px 12px; }
  #frame { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  #fit { position: relative; overflow: hidden; border-radius: var(--radius-lg); background: var(--surface-raised);
         border: var(--border); box-shadow: 0 8px 30px rgba(11,15,46,.10); }
  #scaled { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; }
  #stage { position: absolute; inset: 0; background: var(--surface-frame); }

  #captions { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 48px 20px; min-height: 80px; z-index: 5;
              text-align: center; font: 500 30px/1.4 var(--font-body); color: var(--brand-950);
              background: linear-gradient(to top, rgba(255,255,255,.96) 60%, rgba(255,255,255,0)); pointer-events: none; }
  #captions { text-wrap: balance; }
  #captions .w { display: inline-block; margin: 0 .125em; border-radius: 8px; transition: opacity .12s; }
  #captions .w.later { opacity: .45; }
  #captions .w.key { padding: 0 6px; background: var(--brand-500); color: #fff; font-weight: 700; }
  #unavailable { position: absolute; top: 14px; right: 18px; z-index: 5; padding: 6px 12px; font-size: 20px;
                 border-radius: var(--radius-pill); background: var(--gray-100); color: var(--gray-500); }

  #controls { width: 100%; max-width: 1280px; display: flex; align-items: center; gap: 12px; padding-top: 10px; }
  #progress { flex: 1; height: 6px; border-radius: 3px; background: var(--gray-200); overflow: hidden; }
  #bar { height: 100%; width: 0; background: var(--brand-500); }
  #clock { font-size: 13px; color: var(--gray-500); font-variant-numeric: tabular-nums; min-width: 84px; text-align: right; }

  button { font: 600 15px var(--font-body); border: 0; border-radius: var(--radius-pill); padding: 10px 20px; cursor: pointer;
           background: var(--brand-500); color: #fff; }
  button:hover { background: var(--brand-600); }
  button.ghost { background: var(--gray-100); color: var(--brand-950); }
  button.ghost:hover { background: var(--gray-200); }
  button:focus-visible { outline: 3px solid var(--brand-300); outline-offset: 2px; }
  button[aria-disabled="true"] { background: var(--gray-200); color: var(--gray-500); cursor: not-allowed; }

  /* Overlays sit over the stage box but outside the 1280x720 scaling, sized to the box with container units. */
  @media (orientation: landscape) { #fit { container-type: size; } } /* not in portrait: containment would trap the fixed overlays */
  .overlay { position: absolute; inset: 0; z-index: 10; display: none; flex-direction: column; align-items: center; justify-content: center;
             gap: clamp(10px, 1.6cqw, 20px); background: rgba(248,250,253,.94); text-align: center; padding: clamp(16px, 3cqw, 40px); }
  .overlay h1 { font: 600 clamp(19px, 3.5cqw, 44px)/1.2 var(--font-heading); margin: 0; color: var(--brand-950); text-wrap: balance; }
  .overlay button, .overlay a.btn { font-size: clamp(15px, 1.9cqw, 24px); padding: .65em 1.5em; min-height: 44px; }
  .overlay .row { display: flex; gap: clamp(8px, 1.3cqw, 16px); flex-wrap: wrap; justify-content: center; }
  #ov-loading img { width: clamp(80px, 15.6cqw, 200px); animation: bob 1.8s ease-in-out infinite; }
  #ov-end img, #ov-ready img { width: clamp(72px, 13cqw, 170px); display: none; }
  body.flow #ov-end img, body.flow #ov-ready img { display: block; animation: bob 1.8s ease-in-out infinite; }
  body.reduced #ov-end img, body.reduced #ov-ready img { animation: none; }
  #ov-ready .big { font-size: clamp(18px, 2.7cqw, 34px); padding: .65em 1.55em; box-shadow: 0 10px 28px rgba(70,102,215,.35); }
  /* Portrait (they chose "play here anyway"): the stage is small, so a state screen takes the whole page instead. */
  @media (orientation: portrait) {
    .overlay { position: fixed; z-index: 30; background: var(--surface-base); gap: 18px; padding: 24px; }
    .overlay h1 { font-size: 26px; }
    .overlay button, .overlay a.btn { font-size: 17px; }
    #ov-ready .big { font-size: 20px; }
    #ov-loading img, #ov-end img, #ov-ready img { width: 150px; }
  }
  body[data-state="ready"] #ov-ready, body[data-state="ended"] #ov-end { display: flex; }
  body[data-state="loading"] #ov-loading { display: flex; }
  body.reduced #ov-loading img { animation: none; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  body.still #ov-ready { display: none; }

  #message { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
             padding: 24px; text-align: center; background: var(--surface-base); z-index: 30; }
  #message img { width: 120px; }
  #message p { font-size: 18px; max-width: 480px; margin: 0; color: var(--gray-700); }
  body[data-state="message"] #message { display: flex; }

  /* Portrait phone: a friendly hint to turn sideways; "Play here anyway" dismisses it (never blocks playback). */
  #rotate { position: fixed; inset: 0; z-index: 40; display: none; flex-direction: column; align-items: center; justify-content: center;
            gap: 18px; background: var(--brand-950); color: #fff; text-align: center; padding: 24px; }
  body.rotate-hint #rotate { display: flex; }
  #rotate h2 { margin: 0; font: 600 26px/1.25 var(--font-heading); text-wrap: balance; }
  #rotate p { margin: 0; font-size: 16px; line-height: 1.5; color: var(--brand-100); max-width: 28ch; }
  #rotate .phone { width: 84px; height: 84px; animation: tilt 2.4s ease-in-out infinite; }
  @keyframes tilt { 0%, 25% { transform: rotate(0); } 55%, 85% { transform: rotate(-90deg); } 100% { transform: rotate(0); } }
  #rotate button { background: transparent; color: #fff; text-decoration: underline; text-underline-offset: 4px; font-size: 16px; min-height: 44px; }
  #rotate button:hover { background: rgba(255,255,255,.08); }
  body.reduced #rotate .phone { animation: none; transform: rotate(-90deg); }

  a.btn { display: inline-flex; align-items: center; justify-content: center; font: 600 15px var(--font-body); border-radius: var(--radius-pill);
          padding: 10px 20px; background: var(--brand-500); color: #fff; text-decoration: none; }
  a.btn:hover { background: var(--brand-600); }
  a.btn:focus-visible { outline: 3px solid var(--brand-300); outline-offset: 2px; }
  body.flow #ov-end img { display: block; animation: bob 1.8s ease-in-out infinite; }
  body.reduced #ov-end img { animation: none; }
  #message .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

  /* page-to-page: cross-document view transition (Sherpy carries over from the conversation), fade as fallback */
  @view-transition { navigation: auto; }
  #ov-loading img { view-transition-name: sherpy; }
  html.leaving body { opacity: 0; transition: opacity .3s ease; }
  @media (prefers-reduced-motion: reduce) { @view-transition { navigation: none; } html.leaving body { transition: none; } }
  body[data-state="loading"] #controls, body[data-state="message"] #controls { visibility: hidden; }

  /* Phone held sideways: no header, the stage takes the full height and the controls float small over its bottom edge. */
  @media (orientation: landscape) and (max-height: 500px) {
    header { display: none; }
    main { position: relative; padding: 0; }
    #fit { border-radius: 0; border: 0; box-shadow: none; }
    #controls { position: absolute; left: 50%; bottom: 4px; translate: -50% 0; width: min(560px, calc(100% - 16px)); z-index: 20; gap: 8px; padding: 3px 8px;
                border-radius: var(--radius-pill); background: rgba(255,255,255,.72); box-shadow: 0 2px 10px rgba(11,15,46,.12); }
    #controls button { font-size: 12px; padding: 4px 10px; }
    #progress { height: 4px; }
    #clock { font-size: 11px; min-width: 64px; }
    #captions { bottom: 52px; padding-bottom: 8px; background: linear-gradient(to top, rgba(255,255,255,.96) 75%, rgba(255,255,255,0)); }
  }

  /* ---------- scenes (video-stage.mjs): Sherpas sticker look, 1280x720 space, content kept above the captions band ---------- */
  .sc { --ink: var(--brand-950); position: absolute; inset: 0; overflow: hidden; color: var(--ink); font-family: var(--font-body);
        background: radial-gradient(circle at 2px 2px, var(--gray-200) 2px, transparent 0) 0 0 / 32px 32px, var(--surface-frame); }
  .sc .blob { position: absolute; border-radius: 50%; background: var(--brand-100); }
  .sc .b1 { width: 520px; height: 520px; right: -160px; top: -220px; }
  .sc .b2 { width: 300px; height: 300px; left: -120px; bottom: -60px; background: var(--brand-50); }
  .sc .hl { position: absolute; left: 64px; top: 36px; margin: 0; font: 800 64px/1.15 var(--font-heading); letter-spacing: -.01em; white-space: nowrap; }
  .sc .hi { display: inline-block; margin: 0 6px; padding: 0 20px 4px; background: var(--brand-500); color: #fff; border: 5px solid var(--ink);
            border-radius: 16px; box-shadow: 5px 5px 0 var(--ink); rotate: -2deg; }
  .sc .card { background: #fff; border: 5px solid var(--ink); border-radius: 24px; box-shadow: 6px 6px 0 var(--ink); }
  .sc .stamp { display: inline-block; padding: 8px 20px 10px; font: 800 34px/1 var(--font-heading); text-transform: uppercase; letter-spacing: .05em;
               border: 5px solid var(--ink); border-radius: 12px; box-shadow: 5px 5px 0 var(--ink); white-space: nowrap; }
  .sc .stamp.small { font-size: 22px; padding: 6px 14px 8px; border-width: 4px; box-shadow: 4px 4px 0 var(--ink); }
  .sc .corner { position: absolute; top: -22px; right: -18px; rotate: 7deg; }
  .sc .tone-red { background: var(--error-600); color: #fff; }
  .sc .tone-yellow { background: var(--priority-medium); color: var(--ink); }
  .sc .tone-green { background: var(--success-600); color: #fff; }
  .sc .tone-brand { background: var(--brand-500); color: #fff; }
  .sc .stroke-tone-red { stroke: var(--error-600); } .sc .stroke-tone-yellow { stroke: var(--priority-medium); }
  .sc .stroke-tone-green { stroke: var(--success-600); } .sc .stroke-tone-brand { stroke: var(--brand-500); }
  .sc .disc { display: grid; place-items: center; border-radius: 50%; background: var(--brand-50); border: 5px solid var(--ink); }
  .sc .disc svg { width: 72%; height: 72%; overflow: visible; }
  .sc .kicker { position: absolute; left: 64px; top: 130px; padding: 6px 18px; font: 700 26px/1.3 var(--font-body); background: #fff;
                border: 4px solid var(--ink); border-radius: var(--radius-pill); box-shadow: 4px 4px 0 var(--ink); }

  /* Sherpy (inline SVG from /sherpy.svg, brown fur, brand suit; mouth opens with --lvl) */
  .sc .sherpy { position: absolute; width: 360px; height: 432px; }
  .sc .sherpy .rig, .sc .sherpy .body, .sc .sherpy .arm { position: absolute; inset: 0; }
  .sc .sherpy svg { width: 100%; height: 100%; overflow: visible; display: block; }
  .sc .yak { --suit: var(--brand-700); --lapel: var(--brand-800); --shirt: #fff; --tie: var(--brand-400); --pocket: var(--brand-200);
             --fur: #8a5f40; --fur-dark: #5c3d29; --muzzle: #e2c3a3; --horn: #f3eadb; --cheek: rgba(232,115,138,.28); }
  .sc .yak .head-rig, .sc .yak .mouth-open, .sc .arm-rig { transform-box: fill-box; }
  .sc .yak .head-rig { transform-origin: 50% 90%; transform: translateY(calc(var(--lvl, 0) * -5px)) rotate(calc(var(--lvl, 0) * 2deg)); }
  .sc .yak .mouth-open { transform-origin: 50% 0%; transform: scaleY(var(--lvl, 0)); }
  .sc .arm-rig { transform-origin: 0% 100%; }
  .sc .bubble { position: absolute; padding: 18px 28px; font: 800 40px/1.2 var(--font-heading); background: #fff; border: 5px solid var(--ink);
                border-radius: 28px; box-shadow: 6px 6px 0 var(--ink); white-space: nowrap; }

  /* shared bars: have (navy) vs missing (hatched red); widths proportional, never labelled with a share */
  .sc .sbar { position: relative; height: 44px; background: #fff; border: 4px solid var(--ink); border-radius: 14px; overflow: hidden; }
  .sc .sbar .seg { position: absolute; top: 0; bottom: 0; left: 0; }
  .sc .sbar .have { background: var(--ink); }
  .sc .sbar .miss { background: repeating-linear-gradient(-45deg, var(--error-600) 0 14px, var(--error) 14px 28px); border-left: 4px solid var(--ink); }
  .sc .sbar .miss.alone { border-left: 0; }

  /* 1. dream: warm, postcards on a road in time order */
  .sc-dream { background: radial-gradient(circle at 2px 2px, var(--gray-200) 2px, transparent 0) 0 0 / 32px 32px,
                          color-mix(in srgb, var(--priority-medium) 10%, var(--surface-frame)); }
  .sc-dream .b1 { background: color-mix(in srgb, var(--priority-medium) 30%, white); }
  .sc-dream .b2 { background: color-mix(in srgb, var(--priority-medium) 18%, white); }
  .sc-dream .cheer { width: 160px; height: 192px; right: 64px; top: 14px; }
  .sc-dream .road { position: absolute; left: 40px; right: 40px; top: 531px; height: 14px; border-radius: 7px;
                    background: repeating-linear-gradient(90deg, var(--ink) 0 28px, transparent 28px 44px); }
  .sc-dream .cards { position: absolute; left: 48px; right: 48px; top: 176px; height: 392px; display: flex; gap: 22px;
                     align-items: stretch; justify-content: center; }
  .sc-dream .stop { flex: 0 1 230px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 14px; }
  .sc-dream .stop:has(.main) { flex-basis: 280px; }
  .sc-dream .postcard { position: relative; width: 100%; overflow: visible; display: flex; flex-direction: column; }
  .sc-dream .postcard .sky { height: 112px; display: grid; place-items: center; border-bottom: 5px solid var(--ink); border-radius: 19px 19px 0 0;
                             background: var(--brand-100); }
  .sc-dream .postcard .sky svg { width: 88px; height: 88px; overflow: visible; }
  .sc-dream .postcard.main .sky svg { width: 112px; height: 112px; }
  .sc-dream.many .postcard .sky svg { width: 64px; height: 64px; }
  .sc-dream.many .postcard.main .sky svg { width: 76px; height: 76px; }
  .sc-dream .postcard.main .sky { height: 140px; }
  .sc-dream .sky-retirement { background: color-mix(in srgb, var(--priority-medium) 45%, white) !important; }
  .sc-dream .sky-vacation { background: color-mix(in srgb, var(--chart-6) 30%, white) !important; }
  .sc-dream .sky-purchase { background: color-mix(in srgb, var(--success) 25%, white) !important; }
  .sc-dream .pbody { padding: 10px 12px 16px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
  .sc-dream .postcard .title { font: 800 32px/1.1 var(--font-heading); }
  .sc-dream .postcard.main .title { font-size: 42px; }
  .sc-dream .postcard .sub { font: 700 20px/1.2 var(--font-body); color: var(--gray-500); text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
  .sc-dream .postcard .detail { font: 700 24px/1.2 var(--font-body); white-space: nowrap; }
  .sc-dream .postcard .amount { font: 800 32px/1.1 var(--font-heading); color: var(--brand-500); }
  .sc-dream .pin { padding: 4px 18px; font: 800 28px/1.3 var(--font-heading); color: #fff; background: var(--ink); border: 4px solid #fff;
                   border-radius: var(--radius-pill); white-space: nowrap; box-shadow: 0 0 0 4px var(--ink); }
  .sc-dream.many .cards { gap: 14px; left: 32px; right: 32px; }
  .sc-dream.many .stop, .sc-dream.many .stop:has(.main) { flex-basis: 180px; }
  .sc-dream.many .postcard .sky { height: 84px; }
  .sc-dream.many .postcard.main .sky { height: 100px; }
  .sc-dream.many .postcard .title, .sc-dream.many .postcard.main .title { font-size: 26px; }
  .sc-dream.many .postcard .amount { font-size: 26px; }
  .sc-dream.many .postcard .detail { font-size: 20px; }
  .sc-dream.many .postcard .sub { font-size: 17px; letter-spacing: .03em; }
  .sc-dream.many .pin { font-size: 22px; padding: 3px 12px; }
  .sc-dream.many .corner { font-size: 17px; right: -10px; }

  /* 2. reality: score dial, band, "not on track", most exposed pillar */
  .sc-reality .dial { position: absolute; left: 88px; top: 150px; width: 400px; height: 400px; border-radius: 50%; display: grid; place-items: center; }
  .sc-reality .dial svg { position: absolute; inset: 14px; width: calc(100% - 28px); height: calc(100% - 28px); }
  .sc-reality .dial .num { font: 800 150px/1 var(--font-heading); margin-top: -30px; font-variant-numeric: tabular-nums; }
  .sc-reality .dial .of { position: absolute; top: 262px; font: 600 26px/1 var(--font-body); color: var(--gray-500); }
  .sc-reality .band { position: absolute; left: 150px; top: 500px; font-size: 44px; rotate: -6deg; }
  .sc-reality .offtrack { position: absolute; left: 610px; top: 160px; font-size: 52px; rotate: -4deg; }
  .sc-reality .weakest { position: absolute; left: 610px; right: 80px; top: 280px; padding: 24px 36px 26px; }
  .sc-reality .weakest .label { font: 600 24px/1.2 var(--font-body); color: var(--gray-500); text-transform: uppercase; letter-spacing: .06em; }
  .sc-reality .weakest .name { margin-top: 6px; font: 800 40px/1.1 var(--font-heading); }
  .sc-reality .weakest .pts { margin-top: 8px; font: 800 96px/1 var(--font-heading); transform-origin: 0 50%; }
  .sc-reality .weakest .got { color: var(--error-600); }
  .sc-reality .weakest .of { font-size: 52px; color: var(--gray-500); }

  /* 3. gaps: one row per goal */
  .sc-gaps .grows { position: absolute; left: 64px; right: 64px; top: 166px; bottom: 150px; display: flex; flex-direction: column; justify-content: center; gap: 18px; }
  .sc-gaps .grow { display: flex; align-items: center; gap: 22px; padding: 14px 24px 18px; }
  .sc-gaps .grow .disc { flex: none; width: 84px; height: 84px; }
  .sc-gaps .gmain { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .sc-gaps .gtop { display: flex; align-items: baseline; gap: 16px; white-space: nowrap; }
  .sc-gaps .gtitle { font: 800 32px/1.1 var(--font-heading); }
  .sc-gaps .gnote { padding: 2px 14px; font: 700 22px/1.3 var(--font-body); background: var(--gray-100); border: 3px solid var(--ink); border-radius: var(--radius-pill); }
  .sc-gaps .gnote.warn { background: color-mix(in srgb, var(--error) 14%, white); color: var(--error-600); border-color: var(--error-600); }
  .sc-gaps .gmiss { transform-origin: 100% 60%; margin-left: auto; display: flex; align-items: baseline; gap: 10px; font: 700 24px/1.2 var(--font-body); color: var(--gray-600); }
  .sc-gaps .gmiss .amt { font: 800 40px/1 var(--font-heading); color: var(--error-600); }
  .sc-gaps .cells { display: flex; gap: 8px; }
  .sc-gaps .cell { flex: 1; height: 44px; border: 4px solid var(--ink); border-radius: 10px; background: #fff; }
  .sc-gaps .cell.have { background: var(--ink); }
  .sc-gaps .cell.miss { background: repeating-linear-gradient(-45deg, var(--error-600) 0 10px, var(--error) 10px 20px); }
  .sc-gaps .cell.range { background: repeating-linear-gradient(-45deg, color-mix(in srgb, var(--error) 35%, white) 0 10px, #fff 10px 20px); border-style: dashed; }
  .sc-gaps .n1 .grow, .sc-gaps .n2 .grow { padding: 22px 28px 26px; }
  .sc-gaps .n1 .disc, .sc-gaps .n2 .disc { width: 104px; height: 104px; }
  .sc-gaps .n1 .gtitle, .sc-gaps .n2 .gtitle { font-size: 38px; }
  .sc-gaps .n1 .gmiss .amt, .sc-gaps .n2 .gmiss .amt { font-size: 48px; }
  .sc-gaps .n1 .sbar, .sc-gaps .n2 .sbar, .sc-gaps .n1 .cell, .sc-gaps .n2 .cell { height: 56px; }

  /* 4. fragility: cover vs shortfall per person */
  .sc-fragility .frows { position: absolute; left: 64px; right: 64px; top: 196px; bottom: 150px; display: flex; flex-direction: column; justify-content: center; gap: 24px; }
  .sc-fragility .frow { display: flex; align-items: center; gap: 26px; padding: 18px 28px 22px; }
  .sc-fragility .who { flex: none; width: 150px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .sc-fragility .who .disc { width: 76px; height: 76px; }
  .sc-fragility .who .name { font: 800 30px/1.1 var(--font-heading); }
  .sc-fragility .fmain { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .sc-fragility .flabels { display: flex; align-items: baseline; white-space: nowrap; }
  .sc-fragility .cover, .sc-fragility .short { display: flex; align-items: baseline; gap: 10px; font: 700 24px/1.2 var(--font-body); color: var(--gray-600); }
  .sc-fragility .cover .amt { font: 800 36px/1 var(--font-heading); color: var(--ink); }
  .sc-fragility .short { margin-left: auto; transform-origin: 100% 50%; }
  .sc-fragility .short .amt { font: 800 48px/1 var(--font-heading); color: var(--error-600); }
  .sc-fragility .sbar { height: 60px; }
  .sc-fragility .n1 .frow { padding: 30px 32px 34px; }
  .sc-fragility .n1 .sbar { height: 80px; }

  /* 5. turn: relief, calmer palette, Sherpy back, steps to come */
  .sc-turn { background: radial-gradient(circle at 2px 2px, var(--gray-200) 2px, transparent 0) 0 0 / 32px 32px,
                         color-mix(in srgb, var(--success) 7%, var(--surface-frame)); }
  .sc-turn .b1 { background: color-mix(in srgb, var(--success) 16%, white); }
  .sc-turn .b2 { background: color-mix(in srgb, var(--success) 10%, white); }
  .sc-turn .sun { position: absolute; right: 120px; top: 36px; width: 120px; height: 120px; border-radius: 50%; border: 5px solid var(--ink);
                  background: var(--priority-medium); }
  .sc-turn .guide { left: 40px; top: 190px; width: 300px; height: 360px; }
  .sc-turn .bubble { left: 330px; top: 186px; rotate: -2deg; }
  .sc-turn .fcf { position: absolute; left: 350px; top: 330px; padding: 14px 26px 16px; rotate: 2deg; background: #fff; }
  .sc-turn .fcf .amt { font: 800 54px/1 var(--font-heading); color: var(--success-600); }
  .sc-turn .fcf .what { margin-top: 4px; font: 700 24px/1.2 var(--font-body); color: var(--gray-600); }
  .sc-turn .stairs { position: absolute; right: 70px; top: 230px; width: 510px; height: 330px; }
  .sc-turn .step { position: absolute; bottom: 0; width: 170px; border: 5px dashed var(--brand-500); border-radius: 18px 18px 0 0;
                   background: rgba(255,255,255,.6); }
  .sc-turn .s0 { left: 0; height: 90px; } .sc-turn .s1 { left: 170px; height: 170px; } .sc-turn .s2 { left: 340px; height: 250px; }
  .sc-turn .sflag { position: absolute; left: 392px; bottom: 250px; width: 90px; height: 104px; transform-origin: 25% 100%; }
  .sc-turn .sflag svg { width: 100%; height: 100%; overflow: visible; }

  /* 6. act */
  .sc-act .moves { position: absolute; left: 64px; width: 700px; top: 150px; bottom: 140px; display: flex; flex-direction: column; justify-content: center; gap: 18px; }
  .sc-act.solo .moves { left: 170px; width: 940px; }
  .sc-act .move { display: flex; align-items: center; gap: 20px; padding: 14px 20px; }
  .sc-act .move .disc { flex: none; width: 80px; height: 80px; }
  .sc-act .mtext { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .sc-act .move .title { font: 800 30px/1.12 var(--font-heading); }
  .sc-act .move .link { align-self: flex-start; padding: 2px 12px; font: 700 20px/1.3 var(--font-body); color: var(--success-600);
                        background: color-mix(in srgb, var(--success) 12%, white); border: 3px solid var(--success-600); border-radius: var(--radius-pill); white-space: nowrap; }
  .sc-act .chips { flex: none; display: flex; align-items: center; gap: 10px; }
  .sc-act .chip { min-width: 70px; padding: 6px 10px; text-align: center; font: 800 32px/1.1 var(--font-heading); border: 4px solid var(--ink); border-radius: 14px; }
  .sc-act .chip.before { background: var(--gray-100); color: var(--gray-600); }
  .sc-act .chip.after { background: var(--brand-500); color: #fff; }
  .sc-act .chip.after.up { background: var(--success-600); }
  .sc-act .to { font: 800 32px/1 var(--font-heading); }
  .sc-act .combined { position: absolute; left: 820px; right: 72px; top: 178px; height: 380px; display: flex; flex-direction: column; align-items: center;
                      justify-content: center; background: var(--brand-50); }
  .sc-act .combined .label { font: 600 26px/1.2 var(--font-body); color: var(--gray-500); text-transform: uppercase; letter-spacing: .06em; }
  .sc-act .combined .from { margin-top: 8px; font: 800 56px/1 var(--font-heading); color: var(--gray-500); }
  .sc-act .combined .arrow { font: 800 44px/1.1 var(--font-heading); }
  .sc-act .combined .num { font: 800 150px/1 var(--font-heading); color: var(--success-600); font-variant-numeric: tabular-nums; }
  .sc-act .combined .corner { top: -24px; right: auto; left: 50%; translate: -50% 0; rotate: -4deg; }

  /* 7. mission: the progress bar ends at the dream's year */
  .sc-mission .presenter { right: 70px; top: 160px; }
  .sc-mission .presenter .rig { transform: scaleX(-1); }
  .sc-mission .mission { position: absolute; left: 64px; width: 790px; top: 190px; height: 370px; padding: 56px 40px 30px; rotate: -1.5deg;
                         display: flex; flex-direction: column; justify-content: space-between; }
  .sc-mission .tab { position: absolute; left: 34px; top: -30px; rotate: -5deg; font-size: 36px; }
  .sc-mission .mbody { display: flex; align-items: center; gap: 28px; }
  .sc-mission .mbody .disc { flex: none; width: 130px; height: 130px; background: var(--brand-100); }
  .sc-mission .mbody .title { font: 800 54px/1.1 var(--font-heading); }
  .sc-mission .progress { display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto 40px; column-gap: 14px; row-gap: 8px; align-items: end; }
  .sc-mission .plabel { font: 700 26px/1.2 var(--font-body); color: var(--gray-500); text-transform: uppercase; letter-spacing: .06em; }
  .sc-mission .ptrack { grid-row: 2; height: 40px; border-radius: 20px; background: var(--gray-100); border: 4px solid var(--ink); }
  .sc-mission .pflag { grid-column: 2; grid-row: 1 / span 2; width: 70px; height: 76px; transform-origin: 30% 100%; }
  .sc-mission .pflag svg { width: 100%; height: 100%; overflow: visible; }
  .sc-mission .back { grid-column: 2; grid-row: 1 / span 2; align-self: center; display: flex; align-items: center; gap: 10px; padding: 6px 16px 6px 6px;
                      border-radius: 18px; border-width: 4px; box-shadow: 4px 4px 0 var(--ink); transform-origin: 50% 100%;
                      background: color-mix(in srgb, var(--priority-medium) 22%, white); }
  .sc-mission .back .sky { width: 64px; height: 64px; display: grid; place-items: center; border-radius: 12px; background: #fff; border: 3px solid var(--ink); }
  .sc-mission .back .sky svg { width: 80%; height: 80%; overflow: visible; }
  .sc-mission .back .btext { font: 800 30px/1 var(--font-heading); white-space: nowrap; }

  /* Phone held sideways: the captions sit higher (above the floating controls), so the busiest scenes keep clear of them. */
  @media (orientation: landscape) and (max-height: 500px) {
    .sc-gaps .grows { top: 156px; bottom: 172px; gap: 12px; }
    .sc-gaps .n3 .grow { padding: 10px 22px 12px; }
    .sc-gaps .n3 .gmain { gap: 8px; }
    .sc-gaps .n3 .sbar, .sc-gaps .n3 .cell { height: 38px; }
    .sc-fragility .frows { bottom: 168px; gap: 18px; }
    .sc-act .moves { bottom: 168px; gap: 14px; }
  }
</style>
